[package]
name = "talkdedsec-visual"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Talkdedsec"]
description = "Real-time screen color engine for Windows"
repository = "https://github.com/Talkdedsec1/talkdedsec-visual"

[build-dependencies]
slint-build = "1"
winresource = "0.1"

[dependencies]
slint = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tray-icon = { version = "0.24", default-features = false }
global-hotkey = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Magnification",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
